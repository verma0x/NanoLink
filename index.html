<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NanoLink | by verma0x</title>
  
  <style>
    /* --- MIDNIGHT SAAS THEME --- */
    :root {
      --bg-color: #000000;
      --glass-bg: rgba(15, 15, 15, 0.8);
      --glass-border: #222222;
      --text-main: #ededed;
      --text-muted: #888888;
      --accent-primary: #5e6ad2;
      --accent-success: #2e9961;
      --input-bg: #111111;
      --shadow-glow: 0 0 40px -10px rgba(94, 106, 210, 0.4);
      --font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    /* Ambient Glow Background */
    .bg-animation {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1;
      background: radial-gradient(circle at 50% 0%, rgba(94, 106, 210, 0.15) 0%, #000000 60%);
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.8; }
      100% { transform: scale(1.1); opacity: 1; }
    }

    /* Layout & Cards */
    .app-container {
      width: 100%;
      max-width: 500px;
      z-index: 1;
      display: none; 
      flex-direction: column;
      gap: 30px;
    }

    .branding {
      text-align: center;
    }

    .branding h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .branding span {
      font-size: 0.9rem;
      color: var(--accent-primary);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 30px;
      box-shadow: var(--shadow-glow);
    }

    /* Form Elements */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    input.url-input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      border-radius: 12px;
      padding: 16px;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s;
    }

    input.url-input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 1px var(--accent-primary);
    }

    button.btn-primary {
      background: var(--accent-primary);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
    }

    button.btn-primary:active {
      transform: scale(0.98);
      opacity: 0.9;
    }

    /* Result Area */
    .result-box {
      display: none;
      margin-top: 20px;
      padding: 16px;
      background: rgba(46, 153, 97, 0.1);
      border: 1px solid rgba(46, 153, 97, 0.3);
      border-radius: 12px;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }

    .short-link {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--accent-success);
      margin-bottom: 12px;
      word-break: break-all;
    }

    button.btn-copy {
      background: transparent;
      border: 1px solid var(--accent-success);
      color: var(--accent-success);
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.btn-copy:hover {
      background: var(--accent-success);
      color: #000;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Redirecting State */
    #redirect-screen {
      display: none;
      text-align: center;
      z-index: 2;
    }
    
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--glass-border);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="bg-animation"></div>

  <!-- Loading/Redirecting Screen -->
  <div id="redirect-screen">
    <div class="spinner"></div>
    <h2 style="color: var(--text-muted);">Decrypting link...</h2>
  </div>

  <!-- Main App Interface -->
  <main class="app-container" id="app-ui">
    <div class="branding">
      <h1>NanoLink</h1>
      <span>BY VERMA0X</span>
    </div>

    <div class="glass-card">
      <form id="link-form" class="input-group">
        <input type="url" id="long-url" class="url-input" placeholder="Paste your long URL here..." required autocomplete="off">
        <button type="submit" class="btn-primary" id="submit-btn">Generate NanoLink</button>
      </form>

      <div class="result-box" id="result-box">
        <div class="short-link" id="short-link-display"></div>
        <button class="btn-copy" id="copy-btn">Copy to Clipboard</button>
      </div>
    </div>
  </main>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_MESSAGING_ID",
      appId: "YOUR_APP_ID"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const appUi = document.getElementById('app-ui');
    const redirectScreen = document.getElementById('redirect-screen');
    const hash = window.location.hash.substring(1);

    if (hash) {
      redirectScreen.style.display = 'block';
      db.ref('links/' + hash).once('value').then((snapshot) => {
        const urlData = snapshot.val();
        if (urlData && urlData.longUrl) {
          window.location.replace(urlData.longUrl);
        } else {
          redirectScreen.innerHTML = '<h2 style="color: var(--accent-danger);">Link not found or expired.</h2>';
          setTimeout(() => { window.location.href = window.location.pathname; }, 3000);
        }
      }).catch(error => {
        redirectScreen.innerHTML = '<h2>Connection Error.</h2>';
      });
    } else {
      appUi.style.display = 'flex';
    }

    const form = document.getElementById('link-form');
    const longUrlInput = document.getElementById('long-url');
    const submitBtn = document.getElementById('submit-btn');
    const resultBox = document.getElementById('result-box');
    const shortLinkDisplay = document.getElementById('short-link-display');
    const copyBtn = document.getElementById('copy-btn');

    const generateSlug = () => {
      const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let result = '';
      for (let i = 0; i < 5; i++) {
        result += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return result;
    };

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const longUrl = longUrlInput.value.trim();
      if (!longUrl) return;

      submitBtn.textContent = 'Generating...';
      submitBtn.disabled = true;

      const slug = generateSlug();
      const newUrl = window.location.origin + window.location.pathname + '#' + slug;

      db.ref('links/' + slug).set({
        longUrl: longUrl,
        createdAt: Date.now()
      }).then(() => {
        shortLinkDisplay.textContent = newUrl;
        resultBox.style.display = 'block';
        submitBtn.textContent = 'Generate NanoLink';
        submitBtn.disabled = false;
        longUrlInput.value = '';
      }).catch((error) => {
        alert("Database Error: Check your Firebase rules.");
        submitBtn.textContent = 'Generate NanoLink';
        submitBtn.disabled = false;
      });
    });

    copyBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(shortLinkDisplay.textContent).then(() => {
        const originalText = copyBtn.textContent;
        copyBtn.textContent = 'Copied!';
        copyBtn.style.background = 'var(--accent-success)';
        copyBtn.style.color = '#000';
        
        setTimeout(() => {
          copyBtn.textContent = originalText;
          copyBtn.style.background = 'transparent';
          copyBtn.style.color = 'var(--accent-success)';
        }, 2000);
      });
    });
  </script>
</body>
</html>
